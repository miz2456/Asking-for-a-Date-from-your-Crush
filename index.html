<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date?</title>

    <style>

@import url('https://fonts.googleapis.com/css2?family=Bellota+Text:ital,wght@1,300&display=swap');

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Bellota Text', sans-serif;
}

body, html{
    width: 100%;
    height: 100vh;
    background: linear-gradient(135deg, #ffd6e8, #ff9ecb); /* 💗 pink gradient */
}

.container{
    width: 400px;
    height: 500px;
    position: absolute;
    left: 50%;
    top: 40%;
    transform: translate(-50%,-50%);
    text-align: center;
}

.container h1{
    margin-bottom: 20px;
    margin-top: 50px;
    font-size: 45px;
    font-weight: 700;
    color: #ff4d94;
    text-shadow: 0px 3px 6px #ffc1da;
}

.gif{
    display: flex;
    justify-content: center;
    align-items: center;
    width:100%;
    height: 300px;
}

.gifimg{
    border-radius: 15px;
    width: 384px;
    height: 254px;
    background-image: url("https://media1.tenor.com/m/UAFrdZCt29YAAAAC/milk-and-mocha-waiting-for-reply.gif");
    background-size: cover; 
}

.answer-box{
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    margin-top: 10px;
}

.answer{
    width: 110px;
    height: 50px;
    font-size: 22px;
    border-radius: 15px;
    background: #ff85b3;
    color: white;
    border: 2px solid #ff4d94;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.answer:hover{
    background: #ff4d94;
    transform: scale(1.08);
}

/* confirmation */
.confirmation{
    display: none;
    width: 400px;
    height: 500px;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    text-align: center;
}

.confirmation h1{
    font-size: 40px;
    color: #ff4d94;
    text-shadow: 0px 3px 6px #ffc1da;
}

.fix-gif{
    display: flex;
    justify-content: center;
    align-items: center;
    height: 200px;
}

.fix-gifimg{
    border-radius: 15px;
    width: 300px;
    height: 180px;
    background-image: url("https://media1.tenor.com/m/2VprHA868S8AAAAC/yummy-desserts-desserts-milk-mocha.gif");
    background-size: cover; 
}

#fix{
    margin-top: 20px;
    width: 250px;
    height: 50px;
    font-size: 22px;
    border-radius: 15px;
    background: #ff85b3;
    color: white;
    border: 2px solid #ff4d94;
    cursor: pointer;
}

    </style>
</head>
<body>

    <div class="container">
        <h1>Will you be my date on April 25? 💗</h1>

        <div class="gif">
            <div class="gifimg"></div>
        </div>

        <div class="answer-box">
            <button class="answer" id="yes">Yes 💗</button>
            <button class="answer" id="no">No 😭</button>
        </div>
    </div>

    <div class="confirmation">
        <h1>Yayyy!! 💗 See you on April 25 🥺</h1>

        <div class="fix-gif">
            <div class="fix-gifimg"></div>
        </div>

        <button class="answer" id="fix">Message me 💌</button>
    </div>

<script>
const yes = document.querySelector("#yes");
const no = document.querySelector("#no");
const confirmation = document.querySelector(".confirmation");
const container = document.querySelector(".container");

yes.onclick = () => {
    container.style.display = 'none'
    confirmation.style.display = 'block'
}

no.onclick = () => {
    no.style.position = 'absolute'
    no.style.top = Math.random() * 300 + "px"
    no.style.left = Math.random() * 300 + "px"
}

document.getElementById("fix").onclick = () => {
    window.location = "https://wa.me/639XXXXXXXXX?text=Yes%20I%20will%20be%20your%20date%20on%20April%2025%20💗";
}
</script>

</body>
</html>
